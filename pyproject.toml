[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-unmasking-policy"
version = "0.1.0"
description = "Learned unmasking policies for masked diffusion language models"
license = {text = "Apache-2.0"}
requires-python = "==3.12.*"
dependencies = [
  "torch==2.7.1",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3%2Bcu126torch2.7-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers==4.53.0",
  "accelerate==1.4.0",
  "trl==0.19.1",
  "datasets==4.0.0",
  "evaluate",
  "huggingface-hub",
  "safetensors",
  "numpy>=1.26.0",
  "pyarrow",
  "tqdm",
  "math-verify[antlr4-13-2]==0.8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["train*", "eval*", "common*", "data*", "teacher*"]
